<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outlook AI</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div id="app">
      <!-- barra del titolo (28 pt) -->
      <header class="titlebar">
        <button
          class="titlebar-btn"
          id="btn-invia-ricevi"
          type="button"
          title="Invia e ricevi"
          aria-label="Invia e ricevi"
        >↻</button>
        <span class="titlebar-title" id="window-title">Posta in arrivo</span>
        <span class="titlebar-spacer" aria-hidden="true"></span>
        <span class="search" id="search-box">
          <span class="search-ic" aria-hidden="true">🔍</span>
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Cerca"
            aria-label="Cerca nei messaggi"
            autocomplete="off"
            spellcheck="false"
          />
        </span>
        <span class="help">?</span>
      </header>

      <!-- ribbon (108 pt) -->
      <nav class="ribbon">
        <div class="ribbon-tabs">
          <span class="tab tab--active" data-scheda="home">Home</span>
          <span class="tab" data-scheda="organizza">Organizza</span>
          <span class="tab" data-scheda="strumenti">Strumenti</span>
        </div>
        <div class="ribbon-groups" id="ribbon-groups"></div>
      </nav>

      <!-- corpo -->
      <div class="body">
        <aside class="sidebar" id="sidebar"></aside>

        <section class="main">
          <div class="list-head">
            <span class="col col--flag"></span>
            <span class="col col--from">Mittente</span>
            <span class="col col--subject">Oggetto</span>
            <span class="col col--date">Data ricezione</span>
            <span class="col col--cat">Categoria</span>
            <span class="col col--raggruppa">
              <button
                type="button"
                class="conv-toggle"
                id="raggruppa-toggle"
                aria-pressed="true"
                title="Raggruppa per conversazione"
              >▤ Conversazioni</button>
            </span>
          </div>

          <div class="list" id="message-list"></div>
          <div class="splitter" id="list-splitter" title="Trascina per ridistribuire spazio"></div>
          <div class="pane-sep"></div>

          <div class="reading" id="reading-pane"></div>
        </section>
      </div>

      <!-- barra di stato (26 pt) -->
      <footer class="statusbar">
        <span id="status-count">Elementi: 0</span>
        <span class="statusbar-right">
          <span id="status-sync">Tutte le cartelle sono aggiornate.</span>
          <span id="status-account">Nessun account configurato</span>
        </span>
      </footer>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
